name: Refresh news snapshot

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, at minute 17 (avoids the busy top of the hour)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Africa/Casablanca
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fresh news and rebuild the snapshot (retry once)
        run: python build_static.py || (sleep 30 && python build_static.py)

      - name: Commit & push if anything changed
        run: |
          git config user.name "live-dispatch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Auto refresh news $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs
            git push
          fi