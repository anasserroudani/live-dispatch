name: Refresh news snapshot

# Runs on GitHub's servers (not your Mac), so it works even when your Mac is off.
on:
  schedule:
    - cron: "0 7,19 * * *"   # ~08:00 and 20:00 Morocco time (UTC+1)
  workflow_dispatch: {}        # lets you also run it by hand from the Actions tab

permissions:
  contents: write              # allow the workflow to commit the fresh snapshot

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fresh news and rebuild the snapshot
        run: python build_static.py

      - name: Commit & push if anything changed
        run: |
          git config user.name "live-dispatch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Auto refresh news $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
